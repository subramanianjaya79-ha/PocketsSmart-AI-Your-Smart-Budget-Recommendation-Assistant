{% extends "base.html" %}{% block content %}<div class="card" style="max-width:420px;margin:auto">
<h1>Register</h1>{% if error %}<p class="err">{{ error }}</p>{% endif %}
<form method="post"><label>Username</label><input name="username" required>
<label>Email</label><input name="email" type="email" required>
<label>Password</label><input name="password" type="password" required minlength="6">
<button>Create account</button></form></div>{% endblock %}
